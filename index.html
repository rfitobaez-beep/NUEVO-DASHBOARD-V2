  <!-- MÓDULO 4.5: CALENDARIO VISUAL MENSUAL DE CASILLAS (PLANIFICADOR & NOTAS) -->
  <script>
    function renderMonthlyCalendar(container) {
      if (!appState.calendarNotes) appState.calendarNotes = [];
      const today = window.getTodayDateString();
      const currentMonth = appState.calendarViewMonth || appState.selectedMonth || today.substring(0, 7);
      appState.calendarViewMonth = currentMonth;

      const [yearStr, monthStr] = currentMonth.split('-');
      const year = parseInt(yearStr, 10);
      const monthIndex = parseInt(monthStr, 10) - 1;

      const monthNamesES = [
        'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
        'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
      ];
      const monthLabel = `${monthNamesES[monthIndex]} ${year}`;

      // Estadísticas del mes
      const monthNotes = appState.calendarNotes.filter(n => (n.date || '').startsWith(currentMonth));
      const talleresCount = monthNotes.filter(n => (n.category || '').includes('Taller')).length;
      const clinicoCount = monthNotes.filter(n => (n.category || '').includes('Clínic') || (n.category || '').includes('Salud')).length;
      const eventosCount = monthNotes.filter(n => (n.category || '').includes('Evento') || (n.category || '').includes('Cumple')).length;

      // Generar casillas del calendario (Lunes a Domingo)
      const firstDayDate = new Date(year, monthIndex, 1);
      let firstDow = firstDayDate.getDay(); // 0 Dom, 1 Lun, ...
      firstDow = (firstDow + 6) % 7; // Convertir a 0=Lunes, ..., 6=Domingo

      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, monthIndex, 0).getDate();

      const cells = [];

      // Días previos del mes anterior
      for (let i = firstDow - 1; i >= 0; i--) {
        const d = daysInPrevMonth - i;
        const prevM = monthIndex === 0 ? 12 : monthIndex;
        const prevY = monthIndex === 0 ? year - 1 : year;
        const dStr = `${prevY}-${String(prevM).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        cells.push({ day: d, isCurrentMonth: false, dateStr: dStr });
      }

      // Días del mes en curso
      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        cells.push({ day: d, isCurrentMonth: true, dateStr: dStr });
      }

      // Días siguientes para completar la última semana
      const remaining = 7 - (cells.length % 7);
      if (remaining < 7) {
        for (let d = 1; d <= remaining; d++) {
          const nextM = monthIndex === 11 ? 1 : monthIndex + 2;
          const nextY = monthIndex === 11 ? year + 1 : year;
          const dStr = `${nextY}-${String(nextM).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          cells.push({ day: d, isCurrentMonth: false, dateStr: dStr });
        }
      }

      container.innerHTML = `
        <div class="space-y-6 max-w-7xl mx-auto">
          
          <!-- Encabezado del Calendario Mensual -->
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between flex-wrap gap-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-sky-600 flex items-center justify-center text-white shadow-xs">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5m-9-6h.008v.008H12v-.008zM12 15h.008v.008H12V15zm0 2.25h.008v.008H12v-.008zM9.75 15h.008v.008H9.75V15zm0 2.25h.008v.008H9.75v-.008zM7.5 15h.008v.008H7.5V15zm0 2.25h.008v.008H7.5v-.008z"/></svg>
              </div>
              <div>
                <h3 class="font-bold text-slate-900 text-base flex items-center gap-2">
                  <span>${monthLabel}</span>
                  <span class="text-xs font-normal text-slate-400">(${monthNotes.length} actividades programadas)</span>
                </h3>
                <p class="text-xs text-slate-500">Planificador mensual interactivo de casillas: haz clic en cualquier día o nota para editar</p>
              </div>
            </div>

            <!-- Controles de Navegación del Mes -->
            <div class="flex items-center gap-2">
              <button onclick="window.changeCalendarMonth(-1)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold flex items-center gap-1 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                Anterior
              </button>
              <button onclick="window.goToCurrentCalendarMonth()" class="px-3 py-1.5 bg-sky-50 hover:bg-sky-100 text-sky-800 rounded-lg text-xs font-semibold border border-sky-200 transition-colors">
                Mes Actual (Hoy)
              </button>
              <button onclick="window.changeCalendarMonth(1)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold flex items-center gap-1 transition-colors">
                Siguiente
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              </button>
              <input type="month" value="${currentMonth}" onchange="window.setCalendarMonth(this.value)" class="px-2.5 py-1 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 ml-1">
              <button onclick="window.openCalendarNoteModal()" class="px-3.5 py-1.5 bg-sky-700 hover:bg-sky-800 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-xs transition-colors ml-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                + Nueva Nota / Evento
              </button>
            </div>
          </div>

          <!-- Resumen Rápido de Categorías del Mes -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
            <div class="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between">
              <span class="text-slate-500 font-medium">Talleres Terapéuticos</span>
              <span class="font-bold font-mono px-2 py-0.5 rounded bg-sky-100 text-sky-800">${talleresCount}</span>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between">
              <span class="text-slate-500 font-medium">Atenciones Clínicas</span>
              <span class="font-bold font-mono px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">${clinicoCount}</span>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between">
              <span class="text-slate-500 font-medium">Eventos & Cumpleaños</span>
              <span class="font-bold font-mono px-2 py-0.5 rounded bg-purple-100 text-purple-800">${eventosCount}</span>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between">
              <span class="text-slate-500 font-medium">Total Notas en el Mes</span>
              <span class="font-bold font-mono px-2 py-0.5 rounded bg-slate-100 text-slate-800">${monthNotes.length}</span>
            </div>
          </div>

          <!-- Cuadrícula Mensual de Casillas (7 Columnas Lunes a Domingo) -->
          <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
            <div class="overflow-x-auto">
              <div class="min-w-[500px]">
                <!-- Días de la semana -->
                <div class="grid grid-cols-7 bg-slate-100 border-b border-slate-200 text-center text-xs font-bold text-slate-700 py-2.5">
                  <div><span class="sm:hidden">Lun</span><span class="hidden sm:inline">Lunes</span></div>
                  <div><span class="sm:hidden">Mar</span><span class="hidden sm:inline">Martes</span></div>
                  <div><span class="sm:hidden">Mié</span><span class="hidden sm:inline">Miércoles</span></div>
                  <div><span class="sm:hidden">Jue</span><span class="hidden sm:inline">Jueves</span></div>
                  <div><span class="sm:hidden">Vie</span><span class="hidden sm:inline">Viernes</span></div>
                  <div class="text-slate-500"><span class="sm:hidden">Sáb</span><span class="hidden sm:inline">Sábado</span></div>
                  <div class="text-slate-500"><span class="sm:hidden">Dom</span><span class="hidden sm:inline">Domingo</span></div>
                </div>

                <!-- Casillas del Calendario -->
                <div class="grid grid-cols-7 divide-x divide-y divide-slate-100">
              ${cells.map(cell => {
                const isToday = cell.dateStr === today;
                const dayNotes = appState.calendarNotes.filter(n => n.date === cell.dateStr);

                return `
                  <div class="min-h-[120px] p-2 flex flex-col justify-between transition-colors ${
                    cell.isCurrentMonth ? 'bg-white hover:bg-slate-50/70' : 'bg-slate-50/60 opacity-60'
                  }">
                    <div>
                      <!-- Cabecera de la casilla: Número de día y botón + -->
                      <div class="flex items-center justify-between mb-1.5">
                        <span class="${
                          isToday 
                            ? 'w-6 h-6 rounded-full bg-sky-600 text-white flex items-center justify-center font-bold text-xs shadow-xs' 
                            : cell.isCurrentMonth ? 'font-bold text-slate-800 text-xs' : 'font-semibold text-slate-400 text-xs'
                        }">
                          ${cell.day}
                        </span>

                        <button onclick="window.openCalendarNoteModal(null, '${cell.dateStr}')" class="opacity-40 hover:opacity-100 p-0.5 text-slate-600 hover:text-sky-700 hover:bg-sky-100 rounded text-[11px] font-bold" title="Añadir nota a este día">
                          +
                        </button>
                      </div>

                      <!-- Lista de Notas y Actividades del día -->
                      <div class="space-y-1">
                        ${dayNotes.map(n => {
                          let badgeBg = 'bg-sky-50 text-sky-800 border-sky-200';
                          if ((n.category || '').includes('Clínic') || (n.category || '').includes('Salud')) badgeBg = 'bg-emerald-50 text-emerald-800 border-emerald-200';
                          else if ((n.category || '').includes('Evento') || (n.category || '').includes('Cumple')) badgeBg = 'bg-purple-50 text-purple-800 border-purple-200';
                          else if ((n.category || '').includes('Admin') || (n.category || '').includes('Reunión')) badgeBg = 'bg-amber-50 text-amber-800 border-amber-200';
                          else if ((n.category || '').includes('Urgente') || (n.category || '').includes('Alerta')) badgeBg = 'bg-rose-50 text-rose-800 border-rose-200';

                          return `
                            <div onclick="window.openCalendarNoteModal('${n.id}')" class="p-1 px-1.5 rounded border text-[11px] leading-tight cursor-pointer hover:shadow-xs transition-all ${badgeBg} truncate" title="${n.time ? n.time + ' - ' : ''}${n.title}: ${n.notes || ''}">
                              <strong class="font-semibold">${n.time ? n.time + ' ' : ''}</strong>${n.title}
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>

                    ${dayNotes.length === 0 && cell.isCurrentMonth ? `
                      <button onclick="window.openCalendarNoteModal(null, '${cell.dateStr}')" class="text-[10px] text-slate-300 hover:text-slate-500 text-left pt-2 font-medium">
                        + nota
                      </button>
                    ` : '<div></div>'}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
    }

    window.changeCalendarMonth = function(delta) {
      const current = appState.calendarViewMonth || window.getTodayDateString().substring(0, 7);
      const [y, m] = current.split('-').map(Number);
      const dt = new Date(y, m - 1 + delta, 1);
      const newY = dt.getFullYear();
      const newM = String(dt.getMonth() + 1).padStart(2, '0');
      appState.calendarViewMonth = `${newY}-${newM}`;
      renderMonthlyCalendar(document.getElementById('app-main-content'));
    };

    window.setCalendarMonth = function(val) {
      if (!val) return;
      appState.calendarViewMonth = val;
      renderMonthlyCalendar(document.getElementById('app-main-content'));
    };

    window.goToCurrentCalendarMonth = function() {
      appState.calendarViewMonth = window.getTodayDateString().substring(0, 7);
      renderMonthlyCalendar(document.getElementById('app-main-content'));
    };

    // Modal para Crear y Editar Notas del Calendario Mensual
    window.openCalendarNoteModal = function(noteId = null, prefillDate = null) {
      if (!appState.calendarNotes) appState.calendarNotes = [];
      const note = noteId ? appState.calendarNotes.find(n => n.id === noteId) : null;
      const defaultDate = prefillDate || (note ? note.date : window.getTodayDateString());

      const modal = document.getElementById('modal-container');
      modal.className = 'fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50';
      modal.innerHTML = `
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col">
          <div class="px-5 py-3.5 bg-slate-900 text-white flex items-center justify-between">
            <h3 class="font-bold text-sm flex items-center gap-2">
              <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5m-9-6h.008v.008H12v-.008zM12 15h.008v.008H12V15zm0 2.25h.008v.008H12v-.008zM9.75 15h.008v.008H9.75V15zm0 2.25h.008v.008H9.75v-.008zM7.5 15h.008v.008H7.5V15zm0 2.25h.008v.008H7.5v-.008z"/></svg>
              ${note ? 'Editar Nota / Actividad' : 'Nueva Nota en Calendario'}
            </h3>
            <button onclick="window.closeModal()" class="text-slate-400 hover:text-white">&times;</button>
          </div>

          <form onsubmit="window.saveCalendarNoteForm(event, ${note ? `'${note.id}'` : 'null'})" class="p-5 space-y-3.5 text-xs">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Título de la Actividad o Nota *</label>
              <input type="text" name="title" required value="${note ? note.title : ''}" placeholder="Ej: Taller de Reminiscencia, Control Médico, Cumpleaños" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Fecha *</label>
                <input type="date" name="date" required value="${defaultDate}" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs">
              </div>
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Hora (Opcional)</label>
                <input type="time" name="time" value="${note ? note.time || '' : '10:30'}" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Categoría</label>
                <select name="category" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs">
                  <option value="Taller" ${!note || note.category === 'Taller' ? 'selected' : ''}>Taller / Actividad</option>
                  <option value="Clínico" ${note && note.category === 'Clínico' ? 'selected' : ''}>Atención Clínica / Salud</option>
                  <option value="Evento" ${note && note.category === 'Evento' ? 'selected' : ''}>Evento / Hito Comunitario</option>
                  <option value="Administrativo" ${note && note.category === 'Administrativo' ? 'selected' : ''}>Reunión / Administrativo</option>
                  <option value="Urgente" ${note && note.category === 'Urgente' ? 'selected' : ''}>Recordatorio / Urgente</option>
                </select>
              </div>
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Responsable</label>
                <input type="text" name="responsible" value="${note ? note.responsible || '' : 'Equipo Vitalia'}" placeholder="Ej: Camila Valenzuela (TO)" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs">
              </div>
            </div>

            <div>
              <label class="block font-semibold text-slate-700 mb-1">Detalles u Observaciones</label>
              <textarea name="notes" rows="3" placeholder="Descripción de la actividad, materiales o indicaciones para el equipo..." class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs leading-relaxed">${note ? note.notes || '' : ''}</textarea>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-200">
              ${note ? `
                <button type="button" onclick="window.deleteCalendarNote('${note.id}')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg font-semibold text-xs transition-colors">
                  Eliminar Nota
                </button>
              ` : `<span></span>`}
              <div class="flex items-center gap-2">
                <button type="button" onclick="window.closeModal()" class="px-3 py-1.5 border border-slate-300 rounded-lg font-semibold text-slate-700 hover:bg-slate-100">Cancelar</button>
                <button type="submit" class="px-4 py-1.5 bg-sky-700 hover:bg-sky-800 text-white rounded-lg font-semibold shadow-xs">Guardar Nota</button>
              </div>
            </div>
          </form>
        </div>
      `;
    };

    window.saveCalendarNoteForm = function(e, noteId) {
      e.preventDefault();
      const form = e.target;
      const title = form.title.value.trim();
      const date = form.date.value;
      const time = form.time.value;
      const category = form.category.value;
      const responsible = form.responsible.value.trim();
      const notes = form.notes.value.trim();

      if (!appState.calendarNotes) appState.calendarNotes = [];

      if (noteId) {
        const item = appState.calendarNotes.find(n => n.id === noteId);
        if (item) {
          item.title = title;
          item.date = date;
          item.time = time;
          item.category = category;
          item.responsible = responsible;
          item.notes = notes;
        }
        window.closeModal();
        window.commitState(`Nota de calendario "${title}" actualizada`);
      } else {
        appState.calendarNotes.push({
          id: 'cal-' + Date.now(),
          title,
          date,
          time,
          category,
          responsible,
          notes
        });
        window.closeModal();
        window.commitState(`Actividad "${title}" agregada al calendario (${date})`);
      }
    };

    window.deleteCalendarNote = function(noteId) {
      if (!appState.calendarNotes) return;
      const item = appState.calendarNotes.find(n => n.id === noteId);
      const name = item ? item.title : '';
      if (confirm(`¿Eliminar la nota "${name}" del calendario?`)) {
        appState.calendarNotes = appState.calendarNotes.filter(n => n.id !== noteId);
        window.closeModal();
        window.commitState(`Nota "${name}" eliminada del calendario`);
      }
    };
  </script>

  <!-- MÓDULO 5: FINANZAS, COBRANZAS, GASTOS FIJOS/VARIABLES & EQUILIBRIO -->
  <script>
    let financeSubTab = 'receivables'; // receivables, incomes, fixed, variable, breakeven

    function renderFinance(container) {
      const currentMonth = appState.selectedMonth || window.getTodayDateString().substring(0, 7);

      // Totales
      const monthReceivables = appState.receivables.filter(r => r.month === currentMonth);

    // Métodos interactivos y reactivos para Punto de Equilibrio
    window.updateBreakevenParam = function(type, value) {
      const num = Number(value);
      if (isNaN(num)) return;
      if (type === 'fixed') {
        window.simFixedCosts = Math.max(0, num);
        const input = document.getElementById('sim-fixed-input');
        if (input && input.value != window.simFixedCosts) input.value = window.simFixedCosts;
      } else if (type === 'fee') {
        window.simArancel = Math.max(0, num);
        const input = document.getElementById('sim-fee-input');
        if (input && input.value != window.simArancel) input.value = window.simArancel;
      } else if (type === 'cap') {
        window.simCapacity = Math.max(1, Math.min(100, Math.round(num)));
        const input = document.getElementById('sim-cap-input');
        if (input && input.value != window.simCapacity) input.value = window.simCapacity;
      }
      renderFinance(document.getElementById('app-main-content'));
    };

      window.simFixedCosts = fixed;
      window.simArancel = fee;

      const desc = form.description.value.trim();
      const cat = form.category.value;
      const amount = Number(form.amount.value) || 0;
      const due = form.dueDate.value.trim() || '05 cada mes';
      if (!desc || amount <= 0) return;

      if (existingId) {
        const idx = appState.fixedExpenses.findIndex(x => x.id === existingId);
        if (idx !== -1) {
          appState.fixedExpenses[idx] = { ...appState.fixedExpenses[idx], description: desc, category: cat, amount, dueDate: due };
          window.commitState(`Gasto fijo "${desc}" actualizado`);

          id: 'fix-' + Date.now(),
          description: desc,
          category: cat,
          amount,
          status: 'Pendiente',
          dueDate: due
        });
        window.commitState(`Gasto fijo "${desc}" agregado por ${window.formatCLP(amount)}`);
      }
      window.closeModal();

    window.saveIncomeForm = function(e, incomeId) {
      e.preventDefault();
      const form = e.target;
      const description = form.description.value.trim();
      const amount = Number(form.amount.value) || 0;
      const category = form.category.value;
      const date = form.date.value || window.getTodayDateString();
      const method = form.method.value;
      const receiptNumber = form.receiptNumber.value.trim();

      if (!appState.incomes) appState.incomes = [];

      if (incomeId) {
        const item = appState.incomes.find(i => i.id === incomeId);
        if (item) {
          item.description = description;
          item.amount = amount;
          item.category = category;
          item.date = date;
          item.method = method;
          item.receiptNumber = receiptNumber;
        }
        window.closeModal();
        window.commitState(`Ingreso "${description}" actualizado (${window.formatCLP(amount)})`);
      } else {
        const newInc = {
          id: 'inc-' + Date.now(),
          description,
          amount,
          category,
          date,
          method,
          receiptNumber,
          patientId: ''
        };
        appState.incomes.unshift(newInc);
        window.closeModal();
        window.commitState(`Nuevo ingreso de ${window.formatCLP(amount)} registrado ("${description}")`);
      }
    };

    window.deleteIncome = function(incomeId) {
      if (!appState.incomes) return;
      const inc = appState.incomes.find(i => i.id === incomeId);
      const name = inc ? inc.description : '';
      if (confirm(`¿Eliminar el ingreso "${name}"?`)) {
        appState.incomes = appState.incomes.filter(i => i.id !== incomeId);
        window.closeModal();
        window.commitState(`Ingreso "${name}" eliminado`);
      }
    };

    window.modifyStock = function(itemId, delta) {
      const item = appState.inventory.find(i => i.id === itemId);
      if (item) {
        item.stock = Math.max(0, item.stock + delta);
        window.commitState(`Stock de ${item.name}: ${item.stock} ${item.unit}`);
      }
    };

    window.quickBuyInventoryItem = function(itemId) {
      const item = appState.inventory.find(i => i.id === itemId);
      if (!item) return;
      const qtyStr = prompt(`¿Cuántas unidades de "${item.name}" deseas reponer a bodega?`, '5');
      if (!qtyStr) return;
      const qty = Number(qtyStr);
      if (isNaN(qty) || qty <= 0) return;

      const totalCost = qty * item.unitCost;
      item.stock += qty;

      // Crear automáticamente el gasto variable en Finanzas
      appState.variableExpenses.unshift({
        id: 'var-' + Date.now(),
        date: window.getTodayDateString(),
        description: `Reposición Bodega: ${qty}x ${item.name}`,
        category: 'Insumos Clínicos',
        amount: totalCost,
        paidBy: 'Caja Chica',
        receipt: 'Bol-Rep'
      });

      window.commitState(`Reposición de ${qty} ${item.unit} de ${item.name} registrada en Finanzas (${window.formatCLP(totalCost)})`);
    };

    window.handleAISubmit = function(e) {
      if (e && e.preventDefault) e.preventDefault();

      if (!input) return;

      if (!text) return;

      // Motor de interpretación de PLN y ejecución sobre appState

      window.commitState();

    // Helper de normalización fonética y de caracteres (elimina tildes, puntuación y tolerante a errores)
    function normalizeNlp(str) {
      if (!str) return '';
      return str
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // sin acentos
        .replace(/[,\.;:\?!¡¿\(\)"'\-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Meses en español para parser de fechas naturales
    const SPANISH_MONTHS_MAP = {
      enero: 1, ene: 1,
      febrero: 2, feb: 2,
      marzo: 3, mar: 3,
      abril: 4, abr: 4,
      mayo: 5, may: 5,
      junio: 6, jun: 6,
      julio: 7, jul: 7,
      agosto: 8, ago: 8,
      septiembre: 9, setiembre: 9, sep: 9,
      octubre: 10, oct: 10,
      noviembre: 11, nov: 11,
      diciembre: 12, dic: 12
    };

    // Extractor de fechas en lenguaje natural (ej: "el dia 23 de septiembre", "ayer", "2026-09-23")
    function extractCopilotDate(text, referenceDate) {
      if (!text) return null;
      const norm = normalizeNlp(text);
      const ref = referenceDate || window.getTodayDateString();
      const [refYear, refMonth, refDay] = ref.split('-').map(Number);

      if (norm.includes('anteayer') || norm.includes('antes de ayer')) {
        const d = new Date(refYear, refMonth - 1, refDay - 2);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
      if (norm.includes('ayer')) {
        const d = new Date(refYear, refMonth - 1, refDay - 1);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
      if (norm.includes('hoy')) {
        return ref;
      }

      // Coincidencia tipo "dia 23 de septiembre", "el 23 de septiembre", "23 sep"
      const monthNames = Object.keys(SPANISH_MONTHS_MAP).join('|');
      const monthRegex = new RegExp(`(?:dia\\s+)?(\\d{1,2})\\s*(?:de)?\\s*(${monthNames})(?:\\s*(?:del?|de)?\\s*(\\d{4}))?`, 'i');
      const monthMatch = norm.match(monthRegex);
      if (monthMatch) {
        const day = parseInt(monthMatch[1], 10);
        const monthKey = monthMatch[2].toLowerCase();
        const monthNum = SPANISH_MONTHS_MAP[monthKey];
        const year = monthMatch[3] ? parseInt(monthMatch[3], 10) : refYear;
        if (monthNum && day >= 1 && day <= 31) {
          return `${year}-${String(monthNum).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }
      }

      // Coincidencia ISO YYYY-MM-DD
      const isoMatch = text.match(/\b(\d{4})[-/](\d{1,2})[-/](\d{1,2})\b/);
      if (isoMatch) {
        const y = parseInt(isoMatch[1], 10);
        const m = String(parseInt(isoMatch[2], 10)).padStart(2, '0');
        const d = String(parseInt(isoMatch[3], 10)).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      // Coincidencia DD/MM/YYYY
      const dmyMatch = text.match(/\b(\d{1,2})[-/](\d{1,2})[-/](\d{4})\b/);
      if (dmyMatch) {
        const d = String(parseInt(dmyMatch[1], 10)).padStart(2, '0');
        const m = String(parseInt(dmyMatch[2], 10)).padStart(2, '0');
        const y = parseInt(dmyMatch[3], 10);
        return `${y}-${m}-${d}`;
      }

      return null;
    }

    // Extractor flexible de montos en CLP (soporta "$50.000", "50000", "380 mil", "420.000", etc.)
    function extractCLPAmount(raw) {
      if (!raw) return null;
      const milMatch = raw.match(/(\d+)\s*(?:mil|k)\b/i);
      if (milMatch) {
        return parseInt(milMatch[1], 10) * 1000;
      }
      const numMatch = raw.match(/(?:\$|\bclp\b|\bpesos\b)?\s*(\d{1,3}(?:\.\d{3})+|\d{4,9})/i);
      if (numMatch) {
        return parseInt(numMatch[1].replace(/\./g, ''), 10);
      }
      return null;
    }

    // Helper para detectar paciente con coincidencia flexible de nombre o apellido
    function findPatientFlexible(normText) {
      if (!normText) return null;
      // 1. Coincidencia completa
      for (const p of appState.patients) {
        const normName = normalizeNlp(p.name);
        if (normText.includes(normName)) return p;
      }
      // 2. Coincidencia por partes (nombre o primer apellido de al menos 3 letras)
      for (const p of appState.patients) {
        const parts = normalizeNlp(p.name).split(' ').filter(part => part.length >= 3);
        for (const part of parts) {
          const regex = new RegExp('\\b' + part + '\\b', 'i');
          if (regex.test(normText)) return p;
        }
      }
      return null;
    }

    function executeAICommand(promptText) {
      const norm = normalizeNlp(promptText);
      const today = window.getTodayDateString();
      const currentMonth = today.substring(0, 7);
      const parsedDate = extractCopilotDate(promptText, today);
      const targetDate = parsedDate || today;

      // =========================================================================
      // 1. CASO: ASISTENCIA A TODOS LOS USUARIOS / ASISTENCIA COMPLETA
      // Ej: "pon presente a todos los usuarios", "pon presente a todos el dia 23 de septiembre"
      // =========================================================================
      const isAllPatients = (
        norm.includes('todos') || 
        norm.includes('todas') || 
        norm.includes('toda la cohorte') ||
        norm.includes('todos los usuarios') ||
        norm.includes('todos los pacientes') ||
        norm.includes('asistencia completa')
      );

      const isAttendanceIntent = (
        norm.includes('presente') || 
        norm.includes('presnete') || // typo frecuente
        norm.includes('presentes') || 
        norm.includes('presnetes') ||
        norm.includes('precencia') ||
        norm.includes('asist') ||
        norm.includes('vinieron') ||
        norm.includes('asistieron') ||
        norm.includes('asistencia')
      );

      if (isAllPatients && (isAttendanceIntent || norm.includes('marcar') || norm.includes('anotar') || norm.includes('poner'))) {
        if (!appState.attendanceByDate[targetDate]) appState.attendanceByDate[targetDate] = {};
        const activePatients = appState.patients.filter(p => p.status === 'Activo');
        const cohort = activePatients.length > 0 ? activePatients : appState.patients;

        cohort.forEach(p => {
          appState.attendanceByDate[targetDate][p.id] = {
            status: 'Presente',
            checkIn: '08:45',
            checkOut: '',
            mealIntake: 'Completa',
            notes: `Asistencia colectiva registrada vía Vitalia Copilot para ${targetDate}`
          };
        });

        const namesList = cohort.map(p => `• ${p.name} (${p.plan})`).join('\n');
        return `✓ ASISTENCIA COMPLETA REGISTRADA (${targetDate}):\nHe marcado como PRESENTES a todos los usuarios de la cohorte (${cohort.length} personas) para la fecha ${targetDate} con horario de check-in a las 08:45 hrs:\n\n${namesList}\n\nLos indicadores del Dashboard, la Asistencia Periódica y el Calendario Mensual se han actualizado inmediatamente.`;
      }

      // =========================================================================
      // 2. CASO: ASISTENCIA INDIVIDUAL (PRESENTE / AUSENTE / LICENCIA)
      // Ej: "pon presente a rosa el dia 23 de septiembre", "pon presnete a margarita", "carlos vino ayer"
      // =========================================================================
      const foundPatient = findPatientFlexible(norm);

      if (foundPatient && (
        isAttendanceIntent || 
        norm.includes('vino') || 
        norm.includes('llego') || 
        norm.includes('marcar') || 
        norm.includes('anotar') ||
        norm.includes('falto') ||
        norm.includes('ausente') ||
        norm.includes('licencia')
      )) {
        if (!appState.attendanceByDate[targetDate]) appState.attendanceByDate[targetDate] = {};

        // Subcaso: Ausente / No vino / Faltó
        if (norm.includes('ausente') || norm.includes('falto') || norm.includes('no vino') || norm.includes('inasistencia')) {
          appState.attendanceByDate[targetDate][foundPatient.id] = {
            status: 'Ausente',
            checkIn: '',
            checkOut: '',
            mealIntake: '',
            notes: `Marcado ausente por Vitalia Copilot (${targetDate})`
          };
          return `✓ INASISTENCIA REGISTRADA (${targetDate}):\nHe registrado a ${foundPatient.name} como AUSENTE para la fecha ${targetDate}.\nContacto apoderado: ${foundPatient.guardianName} (${foundPatient.guardianPhone}).`;
        }

        // Subcaso: Licencia médica
        if (norm.includes('licencia')) {
          appState.attendanceByDate[targetDate][foundPatient.id] = {
            status: 'Licencia',
            checkIn: '',
            checkOut: '',
            mealIntake: '',
            notes: `Licencia médica registrada por Vitalia Copilot (${targetDate})`
          };
          return `✓ LICENCIA MÉDICA REGISTRADA (${targetDate}):\nHe registrado la LICENCIA MÉDICA de ${foundPatient.name} para la fecha ${targetDate}.`;
        }

        // Caso General: PRESENTE (con soporte de fechas anteriores como 23 de septiembre)
        appState.attendanceByDate[targetDate][foundPatient.id] = {
          status: 'Presente',
          checkIn: '08:45',
          checkOut: '',
          mealIntake: 'Completa',
          notes: `Asistencia registrada vía Vitalia Copilot (${targetDate})`
        };

        const dateDetail = targetDate === today ? `la jornada de hoy (${today})` : `la fecha indicada (${targetDate})`;
        return `✓ ASISTENCIA REGISTRADA:\nHe registrado como PRESENTE a ${foundPatient.name} (${foundPatient.rut}) para ${dateDetail} con check-in a las 08:45 hrs.\nQuedó guardado en la base de datos de asistencia histórica, la matriz mensual y el calendario del Centro.`;
      }

      // =========================================================================
      // 3. CASO: AGREGAR GASTO (Gasto Variable / Gasto Fijo / Compra Express)
      // Ej: "agrega x gasto", "agrega gasto de 35000 en insumos de aseo", "registra gasto de 15000 cafe", "compre 20000 materiales"
      // =========================================================================
      const isExpenseIntent = (
        norm.includes('gasto') || 
        norm.includes('gastos') || 
        norm.includes('compra') || 
        norm.includes('compre') || 
        norm.includes('compro') || 
        norm.includes('egreso') || 
        norm.includes('desembolso') ||
        norm.includes('pague') ||
        norm.includes('boleta') ||
        norm.includes('factura')
      );

      if (isExpenseIntent) {
        const amount = extractCLPAmount(promptText) || 25000;
        
        // ¿Es gasto fijo o variable?
        const isFixed = norm.includes('fijo') || norm.includes('fijos') || norm.includes('arriendo') || norm.includes('sueldo');

        if (isFixed) {
          let desc = 'Servicio operacional / Gasto fijo';
          if (norm.includes(' en ')) desc = promptText.split(/ en /i)[1];
          else if (norm.includes(' de ')) desc = promptText.split(/ de /i)[1];
          else if (norm.includes(' por ')) desc = promptText.split(/ por /i)[1];
          desc = desc.replace(/\$?\s*[\d\.]+/g, '').trim() || 'Servicio estructural';

          appState.fixedExpenses.push({
            id: 'fix-' + Date.now(),
            description: desc,
            category: 'Infraestructura',
            amount,
            status: 'Pendiente',
            dueDate: '05 cada mes'
          });

          return `✓ GASTO FIJO REGISTRADO:\nSe agregó el Gasto Fijo mensual "${desc}" por ${window.formatCLP(amount)}. El simulador de Punto de Equilibrio y la estructura de costos se han actualizado en tiempo real.`;
        } else {
          // Gasto Variable / Compra Express
          let desc = 'Compra autorizada vía Copilot';
          if (norm.includes(' en ')) desc = promptText.split(/ en /i)[1];
          else if (norm.includes(' de ')) desc = promptText.split(/ de /i)[1];
          else if (norm.includes(' por ')) desc = promptText.split(/ por /i)[1];
          else if (norm.includes(' para ')) desc = promptText.split(/ para /i)[1];
          desc = desc.replace(/\$?\s*[\d\.]+/g, '').trim() || 'Insumos varios';

          // Detección automática de categoría según palabras clave
          let category = 'Compras Express';
          const descLower = normalizeNlp(desc);
          if (descLower.includes('aseo') || descLower.includes('limpieza') || descLower.includes('cloro') || descLower.includes('papel')) {
            category = 'Aseo y Limpieza';
          } else if (descLower.includes('farmacia') || descLower.includes('gasa') || descLower.includes('alcohol') || descLower.includes('medic') || descLower.includes('guante')) {
            category = 'Farmacia e Insumos Clínicos';
          } else if (descLower.includes('cafe') || descLower.includes('te') || descLower.includes('galleta') || descLower.includes('pan') || descLower.includes('fruta') || descLower.includes('colacion') || descLower.includes('alimento')) {
            category = 'Alimentación y Cafetería';
          } else if (descLower.includes('taller') || descLower.includes('terapia') || descLower.includes('material') || descLower.includes('tempera') || descLower.includes('libreria')) {
            category = 'Material Terapéutico';
          }

          appState.variableExpenses.unshift({
            id: 'var-' + Date.now(),
            date: today,
            description: desc,
            category,
            amount,
            paidBy: 'Caja Chica',
            receipt: 'IA-' + Math.floor(Math.random() * 9000 + 1000)
          });

          return `✓ GASTO VARIABLE REGISTRADO:\nHe registrado un egreso por ${window.formatCLP(amount)} por concepto de "${desc}" (Categoría: ${category}) pagado con Caja Chica.\nEl Margen Neto y el Flujo Real de Caja han sido descontados en tiempo real.`;
        }
      }

      // =========================================================================
      // 4. CASO: AGREGAR INGRESO / PAGO / COBRANZA
      // Ej: "agrega x ingreso", "agrega ingreso de 420000 cuota elena", "registra ingreso 380000 don pedro", "marca pagada cuota margarita", "carlos ya pago"
      // =========================================================================
      const isIncomeIntent = (
        norm.includes('ingreso') || 
        norm.includes('ingresos') || 
        norm.includes('abono') || 
        norm.includes('abonos') || 
        norm.includes('pago') || 
        norm.includes('pagar') || 
        norm.includes('pagada') || 
        norm.includes('pagado') || 
        norm.includes('cancelo') || 
        norm.includes('cobro') || 
        norm.includes('recaudacion') ||
        norm.includes('deposito') ||
        norm.includes('transferencia')
      );

      if (isIncomeIntent) {
        const amount = extractCLPAmount(promptText);

        // Subcaso 4A: Se menciona un paciente
        if (foundPatient) {
          let rec = appState.receivables.find(r => r.patientId === foundPatient.id && r.month === currentMonth);
          const finalAmount = amount || (rec ? rec.amount : foundPatient.monthlyFee);

          if (!rec) {
            rec = {
              id: 'rec-' + Date.now(),
              patientId: foundPatient.id,
              patientName: foundPatient.name,
              month: currentMonth,
              amount: finalAmount,
              status: 'Pagado',
              paymentDate: today,
              method: norm.includes('efectivo') ? 'Efectivo en Caja' : norm.includes('pac') ? 'PAC Débito' : 'Transferencia Electrónica',
              receiptNumber: 'COPILOT-' + Math.floor(Math.random() * 9000 + 1000)
            };
            appState.receivables.push(rec);
          } else {
            rec.amount = finalAmount;
            rec.status = 'Pagado';
            rec.paymentDate = today;
            rec.method = norm.includes('efectivo') ? 'Efectivo en Caja' : norm.includes('pac') ? 'PAC Débito' : 'Transferencia Electrónica';
            rec.receiptNumber = 'COPILOT-' + Math.floor(Math.random() * 9000 + 1000);
          }

          return `✓ INGRESO REGISTRADO:\nLa cuota mensual de ${foundPatient.name} por ${window.formatCLP(finalAmount)} ha sido registrada como PAGADA para el periodo ${currentMonth} (${rec.method}).\nEl monto ingresó directamente al Flujo Real de Caja del Centro.`;
        }

        // Subcaso 4B: Ingreso general / institucional / extraordinario
        const generalAmount = amount || 380000;
        let desc = 'Ingreso institucional / Arancel';
        if (norm.includes(' por ')) desc = promptText.split(/ por /i)[1];
        else if (norm.includes(' de ')) desc = promptText.split(/ de /i)[1];
        else if (norm.includes(' en ')) desc = promptText.split(/ en /i)[1];
        desc = desc.replace(/\$?\s*[\d\.]+/g, '').trim() || 'Ingreso percibido';

        if (!appState.incomes) appState.incomes = [];
        appState.incomes.unshift({
          id: 'inc-' + Date.now(),
          date: today,
          description: desc,
          category: 'Subvenciones & Donaciones',
          amount: generalAmount,
          paymentMethod: 'Transferencia Bancaria',
          receipt: 'ING-' + Math.floor(Math.random() * 9000 + 1000)
        });

        return `✓ INGRESO REGISTRADO:\nSe agregó un nuevo ingreso a caja por ${window.formatCLP(generalAmount)} por concepto de "${desc}" (Categoría: Subvenciones & Donaciones).\nEl saldo de cobranzas, la tabla de Ingresos y la caja disponible se han incrementado de inmediato.`;
      }

      // =========================================================================
      // 5. CONSULTAS DE ASISTENCIA: "¿QUIÉNES FALTARON HOY?" / "¿QUIÉNES VINIERON?"
      // =========================================================================
      if (norm.includes('faltaron') || norm.includes('ausentes') || norm.includes('quienes no vinieron') || norm.includes('quien falta')) {
        const todayAtt = appState.attendanceByDate[today] || {};
        const absents = appState.patients.filter(p => {
          if (p.status !== 'Activo') return false;
          const rec = todayAtt[p.id];
          return !rec || rec.status !== 'Presente';
        });

        if (absents.length === 0) {
          return `¡Asistencia perfecta! Hoy ${today} todos los pacientes activos (${appState.patients.filter(p=>p.status==='Activo').length} personas) están registrados como PRESENTES en el Centro.`;
        } else {
          return `📋 PACIENTES AUSENTES O SIN CHECK-IN HOY (${today}):\n` + 
            absents.map(a => `• ${a.name} (${todayAtt[a.id] ? todayAtt[a.id].status : 'Sin registrar'}) — Contacto: ${a.guardianName} al ${a.guardianPhone}`).join('\n');
        }
      }

      if (norm.includes('vinieron') || norm.includes('presentes hoy') || norm.includes('quienes asistieron') || norm.includes('quienes estan')) {
        const todayAtt = appState.attendanceByDate[today] || {};
        const presents = appState.patients.filter(p => todayAtt[p.id] && todayAtt[p.id].status === 'Presente');

        if (presents.length === 0) {
          return `Aún no hay pacientes marcados como presentes hoy (${today}). Puedes escribir "Pon presente a todos los usuarios" para registrarlos de inmediato.`;
        } else {
          return `✓ PACIENTES PRESENTES HOY (${today}) — Total: ${presents.length}:\n` + 
            presents.map(p => `• ${p.name} (Ingreso: ${todayAtt[p.id].checkIn || '08:45'} - Colación: ${todayAtt[p.id].mealIntake || 'Completa'})`).join('\n');
        }
      }

      // =========================================================================
      // 6. CONSULTAS FINANCIERAS & DE CAJA
      // =========================================================================
      if (norm.includes('financiero') || norm.includes('finanzas') || norm.includes('caja') || norm.includes('margen') || norm.includes('balance') || norm.includes('cuanto dinero')) {
        const monthReceivables = appState.receivables.filter(r => r.month === currentMonth);
        const totalDevengado = monthReceivables.reduce((a, b) => a + Number(b.amount || 0), 0);
        const totalCobrado = monthReceivables.filter(r => r.status === 'Pagado').reduce((a, b) => a + Number(b.amount || 0), 0);
        const totalIngresosExtra = (appState.incomes || []).reduce((a, b) => a + Number(b.amount || 0), 0);
        const totalIngresosEfectivos = totalCobrado + totalIngresosExtra;

        const totalGastosFijos = appState.fixedExpenses.reduce((a, b) => a + Number(b.amount || 0), 0);
        const totalGastosVariables = appState.variableExpenses.filter(v => (v.date || '').startsWith(currentMonth)).reduce((a, b) => a + Number(b.amount || 0), 0);
        const totalGastos = totalGastosFijos + totalGastosVariables;

        const margenNeto = (totalDevengado + totalIngresosExtra) - totalGastos;
        const flujoCaja = totalIngresosEfectivos - totalGastos;

        return `📊 ESTADO FINANCIERO EJECUTIVO (${currentMonth}):\n• Total Aranceles Devengados: ${window.formatCLP(totalDevengado)}\n• Cobrado Efectivo de Cuotas: ${window.formatCLP(totalCobrado)}\n• Ingresos Extra & Subvenciones: ${window.formatCLP(totalIngresosExtra)}\n• TOTAL INGRESOS REALES: ${window.formatCLP(totalIngresosEfectivos)}\n• Pendiente por Cobrar Cuotas: ${window.formatCLP(totalDevengado - totalCobrado)}\n• Total Egresos (Fijos + Variables): ${window.formatCLP(totalGastos)}\n• Margen Neto Operacional: ${window.formatCLP(margenNeto)}\n• Flujo Neto Real en Caja: ${window.formatCLP(flujoCaja)}`;
      }

      // =========================================================================
      // 7. CONSULTAS CLÍNICAS (ALERGIAS / CONTACTOS / COHORTE)
      // =========================================================================
      if (norm.includes('alergia') || norm.includes('alergias')) {
        const allergic = appState.patients.filter(p => !p.allergies.toLowerCase().includes('sin'));
        return `⚠️ PACIENTES CON ALERGIAS CONOCIDAS:\n` + allergic.map(p => `• ${p.name}: ${p.allergies} (Contacto: ${p.guardianPhone})`).join('\n');
      }

      if (norm.includes('cuantos pacientes') || norm.includes('cupos') || norm.includes('capacidad')) {
        const active = appState.patients.filter(p => p.status === 'Activo').length;
        return `👥 ESTADO DE COHORTE & OCUPACIÓN:\n• Pacientes Activos: ${active} de 25 cupos SENAMA habilitados\n• Cupos Libres: ${25 - active} vacantes disponibles\n• Tasa de Ocupación actual: ${Math.round((active / 25) * 100)}%`;
      }

      // Respuesta de Ayuda Inteligente si no encaja en lo anterior
      return `He interpretado tu mensaje pero no identifiqué una orden clara. Puedes hablarme con total naturalidad sin fórmulas rígidas, por ejemplo:\n\n• Asistencia: "Pon presente a todos los usuarios", "Pon presente a Elena hoy", "Carlos faltó hoy"\n• Gastos: "Agrega gasto de 35000 en insumos de aseo", "Compré 18000 en café y colaciones"\n• Ingresos: "Agrega ingreso de 420000 cuota de Margarita", "Registra un ingreso de 380000"\n• Consultas: "¿Quiénes faltaron hoy?", "Resumen financiero", "¿Quiénes tienen alergias?"`;
    }
  </script>

  <!-- CIERRE Y MODAL UNIVERSAL -->
  <script>
    window.closeModal = function() {
      const modal = document.getElementById('modal-container');
      if (modal) {
        modal.className = 'relative z-50 hidden';
        modal.innerHTML = '';
      }
    };

    // Inicializador al arrancar la ventana
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      window.commitState();
    });
  </script>

</body>
</html>
