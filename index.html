      let body = clean.slice(0, -1);
      let dv = clean.slice(-1);

              appState.incomes = defState.incomes;
            }
            if (!appState.calendarNotes || !Array.isArray(appState.calendarNotes)) {
              appState.calendarNotes = defState.calendarNotes;
            }
            if (!appState.patients.some(p => p.name.toLowerCase().includes('rosa'))) {
              const rosa = defState.patients.find(p => p.name.toLowerCase().includes('rosa'));
              if (rosa) appState.patients.push(rosa);
            }
            if (Object.keys(appState.attendanceByDate).length <= 1) {
              Object.assign(appState.attendanceByDate, defState.attendanceByDate);
            }
          }
        } else {
          appState = getDefaultState();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }
      } catch (err) {
        console.error('Error al parsear localStorage:', err);
        appState = getDefaultState();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      }
      window.appState = appState;
    }

    // Motor de guardado inmutable anti-pérdida F5
    window.commitState = function(actionDescription) {
      if (!appState) return;
      window.appState = appState;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        
        // Actualizar badge visual en el Header
        const now = new Date();
        const timeStr = now.toLocaleTimeString('es-CL');
        const badgeText = document.getElementById('autosave-text');
        if (badgeText) {
          badgeText.innerText = `Guardado automático: ${timeStr}`;
        }
        const badge = document.getElementById('autosave-badge');
        if (badge) {
          badge.classList.remove('bg-emerald-50', 'border-emerald-200/80');
          badge.classList.add('bg-emerald-100', 'border-emerald-400');
          setTimeout(() => {
            badge.classList.remove('bg-emerald-100', 'border-emerald-400');
            badge.classList.add('bg-emerald-50', 'border-emerald-200/80');
          }, 350);
        }

        // Actualizar badges del sidebar
        const countBadge = document.getElementById('badge-patients-count');
        if (countBadge) {
          countBadge.innerText = appState.patients.filter(p => p.status === 'Activo').length;
        }

        // Re-renderizar la vista activa para reflejar cambios
        window.renderActiveView();

        if (actionDescription) {
          window.showToast(actionDescription, 'success');
        }
      } catch (e) {
        console.error('Error crítico en commitState:', e);
        window.showToast('Error al persistir en base local', 'error');
      }
    };

    // Seguro ante cierre o recarga abrupta con F5
    window.addEventListener('beforeunload', () => {
      if (appState) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));

    });

    // Sistema de notificaciones Toast no intrusivas
    window.showToast = function(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      
      const toast = document.createElement('div');
      let border = 'border-slate-300';
      let bg = 'bg-white';
      let text = 'text-slate-800';
      let icon = '<svg class="w-4 h-4 text-sky-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';

      if (type === 'success') {
        border = 'border-emerald-200';
        bg = 'bg-emerald-50';
        text = 'text-emerald-900';
        icon = '<svg class="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
      } else if (type === 'error') {
        border = 'border-rose-200';
        bg = 'bg-rose-50';
        text = 'text-rose-900';
        icon = '<svg class="w-4 h-4 text-rose-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
      }

      toast.className = `flex items-center gap-2.5 px-4 py-2.5 rounded-lg shadow-lg border ${border} ${bg} ${text} text-xs font-medium transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto max-w-sm`;
      toast.innerHTML = `${icon}<span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    };

    window.syncPatientToModules = function(patient) {
      const currentMonth = appState.selectedMonth || window.getTodayDateString().substring(0, 7);
      
      // 1. Finanzas: Verificar o crear cuenta por cobrar para el mes actual
      let rec = appState.receivables.find(r => r.patientId === patient.id && r.month === currentMonth);
      if (!rec) {
        appState.receivables.unshift({
          id: 'rec-' + Date.now() + '-' + Math.floor(Math.random()*1000),
          patientId: patient.id,
          patientName: patient.name,
          month: currentMonth,
          amount: Number(patient.monthlyFee) || 0,
          status: 'Pendiente',
          paymentDate: '',
          method: '',
          receiptNumber: ''
        });
      } else {
        rec.patientName = patient.name;
        rec.amount = Number(patient.monthlyFee) || 0;
      }

      // 2. Asistencia: Inicializar registro para hoy si no existe
      const today = window.getTodayDateString();
      if (!appState.attendanceByDate[today]) {
        appState.attendanceByDate[today] = {};
      }
      if (!appState.attendanceByDate[today][patient.id]) {
        appState.attendanceByDate[today][patient.id] = {
          status: 'Presente',
          checkIn: '08:45',
          checkOut: '',
          mealIntake: 'Completa',
          notes: ''
        };
      }
    };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `VITALIA_ERP_RESPALDO_${window.getTodayDateString()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      window.showToast('Respaldo JSON descargado con éxito', 'success');
    };

    // Cargar respaldo JSON
    window.uploadBackupJSON = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.patients && parsed.attendanceByDate && parsed.receivables) {
            appState = parsed;
            window.commitState('Respaldo cargado correctamente');
            event.target.value = '';
          } else {
            alert('El archivo no contiene la estructura válida de Vitalia ERP.');
          }
        } catch (err) {
          alert('Error al leer el archivo JSON: ' + err.message);
        }
      };
      reader.readAsText(file);
    };

        window.commitState('Sistema restaurado a valores de fábrica');

    window.exportMasterExcel = function() {
      try {
        const wb = XLSX.utils.book_new();

        // 1. Padrón de Pacientes
        const patientsData = appState.patients.map(p => ({
          'ID': p.id,
          'Nombre Completo': p.name,
          'RUT': p.rut,
          'Edad': p.age,
          'Previsión': p.prevision,
          'Plan': p.plan,
          'Días/Semana': p.daysPerWeek,

          'Apoderado': p.guardianName,

        }));

        // 2. Cobranzas Mensuales

          'Fecha Pago': r.paymentDate,
          'Método': r.method,
          'Comprobante': r.receiptNumber
        }));
        const wsRec = XLSX.utils.json_to_sheet(receivablesData);
        XLSX.utils.book_append_sheet(wb, wsRec, "Cobranzas");

        // 3. Gastos Fijos
        const fixedData = appState.fixedExpenses.map(f => ({

          'Categoría': f.category,
          'Monto CLP': f.amount,

        }));
        const wsFixed = XLSX.utils.json_to_sheet(fixedData);
        XLSX.utils.book_append_sheet(wb, wsFixed, "Gastos Fijos");

        // 4. Gastos Variables
        const varData = appState.variableExpenses.map(v => ({

        }));

        // 5. Inventario
        const invData = appState.inventory.map(i => ({

        window.showToast('Planilla Excel Master exportada exitosamente', 'success');

          break;

          renderAttendance(container);
          break;

          break;

          break;

      const today = window.getTodayDateString();
      const currentMonth = appState.selectedMonth || today.substring(0, 7);

      // Cálculos KPI
      const activePatients = appState.patients.filter(p => p.status === 'Activo');
      const activeCount = activePatients.length;
      const capacity = appState.capacity || 25;
      const occupancyRate = Math.round((activeCount / capacity) * 100);

      // Asistencia de hoy
      const todayAtt = appState.attendanceByDate[today] || {};
      let presentCount = 0;
      let absentCount = 0;
      let medicalLeaveCount = 0;

      activePatients.forEach(p => {
        const att = todayAtt[p.id];
        if (att) {
          if (att.status === 'Presente') presentCount++;
          else if (att.status === 'Licencia') medicalLeaveCount++;
          else absentCount++;
        } else {
          // Por defecto no registrado aún
          absentCount++;
        }

      // Finanzas del mes
      const monthReceivables = appState.receivables.filter(r => r.month === currentMonth);
      const totalDevengado = monthReceivables.reduce((acc, cur) => acc + (Number(cur.amount) || 0), 0);
      const totalCobrado = monthReceivables.filter(r => r.status === 'Pagado').reduce((acc, cur) => acc + (Number(cur.amount) || 0), 0);
      const totalPendienteCobro = totalDevengado - totalCobrado;

                </span>
              </div>
              <div>
                <div class="flex items-baseline gap-2">
                  <span class="text-2xl font-bold text-slate-900">${activeCount}</span>
                  <span class="text-sm font-medium text-slate-400">/ ${capacity} cupos</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-1.5 mt-3 overflow-hidden">

                <span class="font-semibold text-rose-700">${window.formatCLP(totalEgresosTotales)}</span>

          p.name.toLowerCase().includes(q) || 
          p.rut.toLowerCase().includes(q) || 
          p.diagnosis.toLowerCase().includes(q);

                          p.status === 'Licencia' ? 'bg-amber-50 text-amber-800 border border-amber-200' :
                          'bg-slate-100 text-slate-600 border border-slate-200'

                      </div>

                          <span class="text-slate-500 text-[10px]">Apoderado responsable</span>

                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>

              <button type="submit" class="px-5 py-2 bg-sky-700 hover:bg-sky-800 text-white rounded-lg font-semibold transition-colors shadow-xs">

    window.savePatientForm = function(event, existingId) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);

      const nameVal = (formData.get('name') || '').toString().trim();
      if (!nameVal) {
        window.showToast('El nombre del paciente es obligatorio', 'error');
        return;
      }

      const rutVal = (formData.get('rut') || '').toString().trim();
      const monthlyFeeVal = Number(formData.get('monthlyFee')) || 420000;

      const patientData = {
        name: nameVal,
        rut: window.formatRUT(rutVal || '12.345.678-9'),
        age: Number(formData.get('age')) || 78,
        prevision: (formData.get('prevision') || 'FONASA B').toString(),
        plan: (formData.get('plan') || 'Jornada Completa').toString(),
        daysPerWeek: Number(formData.get('daysPerWeek')) || 5,
        monthlyFee: monthlyFeeVal,
        status: (formData.get('status') || 'Activo').toString(),
        guardianName: (formData.get('guardianName') || 'Familiar / Tutor').toString().trim(),
        guardianPhone: (formData.get('guardianPhone') || '+56 9 0000 0000').toString().trim(),
        diagnosis: (formData.get('diagnosis') || 'Deterioro Cognitivo Leve').toString().trim(),
        mmse: Number(formData.get('mmse')) || 24,
        gds: Number(formData.get('gds')) || 3,
        mobility: (formData.get('mobility') || 'Autovalente').toString().trim(),
        allergies: (formData.get('allergies') || 'Sin alergias').toString().trim()
      };

      if (existingId) {
        // Actualizar paciente existente
        const idx = appState.patients.findIndex(p => p.id === existingId);
        if (idx !== -1) {
          appState.patients[idx] = { ...appState.patients[idx], ...patientData };
          window.syncPatientToModules(appState.patients[idx]);
          window.closeModal();
          window.commitState(`Paciente ${patientData.name} actualizado exitosamente`);
        }
      } else {
        // Crear nuevo paciente
        const newPatient = {
          id: 'pat-' + Date.now(),
          ...patientData,
          medications: [],
          notes: [{
            id: 'not-' + Date.now(),
            author: 'Admisión Vitalia',
            role: 'Equipo Clínico',
            date: window.getTodayDateString(),
            text: 'Ingreso al Centro Diurno registrado en el sistema.',
            verified: true
          }],
          mmseHistory: [
            { date: window.getTodayDateString(), score: patientData.mmse }
          ],
          documents: []
        };
        appState.patients.unshift(newPatient);
        window.syncPatientToModules(newPatient);
        window.closeModal();
        window.commitState(`Nuevo paciente ${newPatient.name} creado e integrado a Finanzas`);
      }
    };

    // Modal de confirmación en pantalla (sin depender de window.confirm del navegador)
    window.promptDeletePatient = function(id) {
      const patient = appState.patients.find(p => p.id === id);
      if (!patient) return;

      const modal = document.getElementById('modal-container');
      modal.className = 'fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50';

      modal.innerHTML = `
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col">
          <div class="px-5 py-4 bg-rose-50 border-b border-rose-100 flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
            </div>
            <div>
              <h3 class="font-bold text-sm text-rose-950">Confirmar Eliminación de Paciente</h3>
              <p class="text-xs text-rose-700">Esta acción dará de baja su expediente</p>
            </div>
          </div>

          <div class="p-5 text-xs text-slate-700 space-y-2">
            <p>¿Estás seguro de que deseas eliminar a <strong>${patient.name}</strong> (${patient.rut}) del padrón?</p>
            <p class="text-slate-500">Se eliminará su expediente clínico, sus cuotas pendientes en Finanzas y sus registros de asistencia asociados.</p>
          </div>

          <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-2.5">
            <button type="button" onclick="window.closeModal()" class="px-3.5 py-1.5 border border-slate-300 hover:bg-slate-100 rounded-lg font-semibold text-slate-700 text-xs transition-colors">
              Cancelar
            </button>
            <button type="button" onclick="window.deletePatient('${patient.id}')" class="px-4 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-semibold text-xs transition-colors shadow-xs">
              Sí, Eliminar Paciente
            </button>
          </div>
        </div>
      `;
    };

    window.deletePatient = function(id) {
      const patient = appState.patients.find(p => p.id === id);
      if (!patient) return;
      
      const patientName = patient.name;
      appState.patients = appState.patients.filter(p => p.id !== id);
      appState.receivables = appState.receivables.filter(r => r.patientId !== id);
      
      // Limpieza de registros en asistencia por fecha
      if (appState.attendanceByDate) {
        Object.keys(appState.attendanceByDate).forEach(d => {
          if (appState.attendanceByDate[d] && appState.attendanceByDate[d][id]) {
            delete appState.attendanceByDate[d][id];
          }
        });
      }

      window.closeModal();
      window.commitState(`Paciente ${patientName} eliminado del sistema`);
    };
  </script>

  <!-- MÓDULO 2 (CONTINUACIÓN): EXPEDIENTE CLÍNICO INDIVIDUAL (4 PESTAÑAS) -->
  <script>
    let activeFilePatientId = null;

      activeFilePatientId = patientId;
      activeFileTab = defaultTab;

          <div id="patient-file-content" class="p-6 overflow-y-auto flex-1 bg-slate-50 text-xs">
            <!-- Dynamic Content based on activeFileTab -->
          </div>

        </div>
      `;

      renderPatientFileTabContent(patient);
    }

      const patient = appState.patients.find(p => p.id === activeFilePatientId);
      if (patient) renderPatientFileModal();

                <button onclick="window.addClinicalNote('${patient.id}')" class="px-4 py-1.5 bg-sky-700 hover:bg-sky-800 text-white rounded font-semibold text-xs">

                </button>

            <!-- Bitácora de Notas -->
            <div class="space-y-3">

                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs space-y-2">
                  <div class="flex items-center justify-between border-b border-slate-100 pb-2">

              <div>
                <h4 class="font-bold text-slate-900 text-sm">Controles Periódicos MMSE (Folstein)</h4>
                <p class="text-xs text-slate-500">Evaluación estándar recomendada por SENAMA cada 3 a 6 meses</p>
              </div>
              <button onclick="window.promptAddMMSE('${patient.id}')" class="px-3 py-1.5 bg-sky-700 hover:bg-sky-800 text-white rounded text-xs font-semibold">+ Nuevo Control MMSE</button>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
              <div class="h-56 relative">
                <canvas id="chart-patient-mmse"></canvas>
              </div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 font-bold text-slate-500 uppercase text-[11px]">
                  <tr>
                    <th class="p-3">Fecha Evaluación</th>
                    <th class="p-3">Puntaje Obtenido</th>
                    <th class="p-3">Interpretación Clínica</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${(!patient.mmseHistory || patient.mmseHistory.length === 0) ? `
                    <tr><td colspan="3" class="p-4 text-center text-slate-400">Sin historial registrado.</td></tr>
                  ` : patient.mmseHistory.map(h => `
                    <tr>
                      <td class="p-3 font-mono font-medium">${h.date}</td>
                      <td class="p-3 font-bold ${h.score >= 24 ? 'text-emerald-700' : h.score >= 18 ? 'text-amber-700' : 'text-rose-700'}">${h.score} / 30</td>
                      <td class="p-3 text-slate-600">
                        ${h.score >= 24 ? 'Normal / Sin deterioro significativo' : h.score >= 18 ? 'Deterioro Cognitivo Leve' : 'Deterioro Moderado'}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;

        setTimeout(() => {
          const ctx = document.getElementById('chart-patient-mmse');
          if (ctx && patient.mmseHistory) {
            chartsInstances['patient_mmse'] = new Chart(ctx, {
              type: 'line',
              data: {
                labels: patient.mmseHistory.map(h => h.date),
                datasets: [{
                  label: 'Puntaje MMSE',
                  data: patient.mmseHistory.map(h => h.score),
                  borderColor: '#0369a1',
                  backgroundColor: 'rgba(3, 105, 161, 0.1)',
                  fill: true,
                  tension: 0.2,
                  pointRadius: 6
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                  y: { min: 10, max: 30, ticks: { stepSize: 5 } }
                }
              }
            });
          }

      } else if (activeFileTab === 'docs') {
        container.innerHTML = `
          <div class="space-y-4">
            
            <!-- Zona de Subida MÚLTIPLE y Drag & Drop con <input type="file" multiple> -->
            <div id="drop-zone" ondragover="window.handleDragOver(event)" ondragleave="window.handleDragLeave(event)" ondrop="window.handleFileDrop(event, '${patient.id}')" class="bg-white border-2 border-dashed border-slate-300 hover:border-sky-500 rounded-xl p-6 text-center transition-all cursor-pointer">
              <svg class="w-8 h-8 text-sky-600 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/></svg>
              <p class="font-bold text-slate-800 text-sm">Arrastra y suelta documentos aquí o haz clic para subir</p>
              <p class="text-xs text-slate-500 mt-1">Soporta selección MÚLTIPLE de PDFs, recetas médicas, exámenes de sangre, TAC/RNM o contratos</p>
              
              <input type="file" id="patient-multi-file-input" multiple onchange="window.handleMultipleFilesSelect(event, '${patient.id}')" class="hidden">
              <button type="button" onclick="document.getElementById('patient-multi-file-input').click()" class="mt-3 px-4 py-1.5 bg-sky-700 hover:bg-sky-800 text-white rounded-lg font-semibold text-xs shadow-xs">
                Seleccionar Varios Archivos
              </button>
            </div>

            <!-- Listado de Documentos Adjuntos Guardados en LocalStorage -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
              <div class="p-3.5 border-b border-slate-100 flex items-center justify-between">
                <h4 class="font-bold text-slate-900 text-xs uppercase tracking-wider">Documentos Almacenados (${patient.documents ? patient.documents.length : 0})</h4>
                <span class="text-[11px] text-slate-400">Persistencia segura en Base Local</span>
              </div>

              ${(!patient.documents || patient.documents.length === 0) ? `
                <div class="p-6 text-center text-slate-400 text-xs">
                  No hay documentos adjuntos subidos para este paciente aún.
                </div>
              ` : `
                <div class="divide-y divide-slate-100">
                  ${patient.documents.map((doc, idx) => `
                    <div class="p-3 flex items-center justify-between hover:bg-slate-50 transition-colors">
                      <div class="flex items-center gap-3">
                        <span class="p-2 rounded bg-sky-50 text-sky-700">
                          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        </span>
                        <div>
                          <div class="font-semibold text-slate-900">${doc.name}</div>
                          <div class="text-[10px] text-slate-400">${doc.category || 'Examen Clínico'} • ${doc.size || 'N/A'} • Subido el ${doc.uploadDate}</div>
                        </div>
                      </div>
                      <div class="flex items-center gap-2">
                        <button onclick="window.viewPatientDocument('${patient.id}', ${idx})" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-semibold text-xs">
                          Visualizar
                        </button>
                        <button onclick="window.deletePatientDocument('${patient.id}', ${idx})" class="p-1 text-rose-500 hover:text-rose-700 font-bold" title="Eliminar documento">

                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}

          </div>

    // Medicamentos
    window.promptAddMedication = function(patientId) {
      const name = prompt('Nombre del fármaco:');
      if (!name) return;
      const dose = prompt('Dosis (ej: 10 mg):', '10 mg');
      const schedule = prompt('Horario de administración (ej: 13:00 con almuerzo):', '13:00');
      
      const patient = appState.patients.find(p => p.id === patientId);
      if (patient) {
        if (!patient.medications) patient.medications = [];
        patient.medications.push({ name, dose: dose || '', schedule: schedule || '' });
        window.commitState(`Medicamento ${name} agregado`);
        renderPatientFileTabContent(patient);
      }
    };

    window.deleteMedication = function(patientId, idx) {
      const patient = appState.patients.find(p => p.id === patientId);
      if (patient && patient.medications) {
        patient.medications.splice(idx, 1);
        window.commitState('Medicamento eliminado');
        renderPatientFileTabContent(patient);
      }
    };

    // Notas clínicas
    window.addClinicalNote = function(patientId) {
      const author = document.getElementById('note-author-input').value.trim();
      const role = document.getElementById('note-role-input').value;
      const text = document.getElementById('note-text-input').value.trim();

      if (!author || !text) {
        alert('Por favor indica tu nombre y la nota clínica antes de firmar.');
        return;
      }

      const patient = appState.patients.find(p => p.id === patientId);
      if (patient) {
        if (!patient.notes) patient.notes = [];
        patient.notes.unshift({
          id: 'not-' + Date.now(),
          author,
          role,
          date: window.getTodayDateString(),
          text,
          verified: true
        });
        window.commitState(`Nota clínica firmada por ${author}`);
        renderPatientFileTabContent(patient);
      }
    };

    // Controles MMSE
    window.promptAddMMSE = function(patientId) {
      const scoreStr = prompt('Nuevo puntaje MMSE obtenido (0 a 30):', '24');
      if (scoreStr === null) return;
      const score = Number(scoreStr);
      if (isNaN(score) || score < 0 || score > 30) {
        alert('Puntaje inválido.');
        return;
      }

      const patient = appState.patients.find(p => p.id === patientId);
      if (patient) {
        patient.mmse = score;
        if (!patient.mmseHistory) patient.mmseHistory = [];
        patient.mmseHistory.push({
          date: window.getTodayDateString(),
          score
        });
        window.commitState(`Control MMSE de ${score} pts registrado`);
        renderPatientFileTabContent(patient);
      }
    };

    // Subida múltiple y persistencia de documentos
    window.handleDragOver = function(e) {
      e.preventDefault();
      e.stopPropagation();
      e.currentTarget.classList.add('border-sky-600', 'bg-sky-50/50');
    };

    window.handleDragLeave = function(e) {
      e.preventDefault();
      e.stopPropagation();
      e.currentTarget.classList.remove('border-sky-600', 'bg-sky-50/50');
    };

    window.handleFileDrop = function(e, patientId) {
      e.preventDefault();
      e.stopPropagation();
      e.currentTarget.classList.remove('border-sky-600', 'bg-sky-50/50');
      if (e.dataTransfer && e.dataTransfer.files) {
        processUploadedFiles(e.dataTransfer.files, patientId);
      }
    };

    window.handleMultipleFilesSelect = function(e, patientId) {
      if (e.target.files) {
        processUploadedFiles(e.target.files, patientId);
      }
    };

    function processUploadedFiles(fileList, patientId) {
      const patient = appState.patients.find(p => p.id === patientId);
      if (!patient) return;
      if (!patient.documents) patient.documents = [];

      const files = Array.from(fileList);
      let loadedCount = 0;

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const dataUrl = e.target.result;
          const sizeKb = (file.size / 1024).toFixed(1) + ' KB';

          // Detectar categoría sugerida
          let category = 'Examen Clínico';
          if (file.name.toLowerCase().includes('receta')) category = 'Receta Médica';
          else if (file.name.toLowerCase().includes('contrato')) category = 'Contrato de Servicio';
          else if (file.name.toLowerCase().includes('informe')) category = 'Informe Diagnóstico';

          patient.documents.unshift({
            name: file.name,
            type: file.type,
            size: sizeKb,
            category: category,
            uploadDate: window.getTodayDateString(),
            dataUrl: dataUrl
          });

          loadedCount++;
          if (loadedCount === files.length) {
            window.commitState(`${files.length} archivo(s) guardado(s) en la ficha`);
            renderPatientFileTabContent(patient);
          }
        };
        // Para asegurar persistencia en localStorage leemos archivos como DataURL
        reader.readAsDataURL(file);
      });
    }

    window.deletePatientDocument = function(patientId, idx) {
      const patient = appState.patients.find(p => p.id === patientId);
      if (patient && patient.documents) {
        if (confirm('¿Eliminar este documento adjunto?')) {
          patient.documents.splice(idx, 1);
          window.commitState('Documento eliminado');
          renderPatientFileTabContent(patient);
        }
      }
    };

    window.viewPatientDocument = function(patientId, idx) {
      const patient = appState.patients.find(p => p.id === patientId);
      if (!patient || !patient.documents || !patient.documents[idx]) return;
      const doc = patient.documents[idx];

      const win = window.open();
      if (win) {
        win.document.write(`
          <html>
            <head><title>${doc.name} - Visor Vitalia</title></head>
            <body style="margin:0; background:#0f172a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:sans-serif; color:white;">
              <div style="padding:15px; background:#1e293b; width:100%; box-sizing:border-box; display:flex; justify-content:space-between; align-items:center;">
                <span><strong>${doc.name}</strong> (${doc.size})</span>
                <a href="${doc.dataUrl}" download="${doc.name}" style="background:#0284c7; color:white; padding:8px 16px; border-radius:6px; text-decoration:none; font-weight:bold;">Descargar Original</a>
              </div>
              <iframe src="${doc.dataUrl}" style="flex:1; width:100%; border:none;"></iframe>
            </body>
          </html>
        `);
      } else {
        alert('El navegador bloqueó la ventana emergente para visualizar el archivo.');
      }
    };
  </script>

  <!-- MÓDULO 3: ASISTENCIA DIARIA & MATRIZ MENSUAL -->
  <script>
    let attendanceSubTab = 'calendar-all'; // 'calendar-all', 'calendar-patient', 'daily'

    function renderAttendance(container) {
      const currentDate = appState.selectedDate || window.getTodayDateString();
      const currentMonth = appState.selectedMonth || currentDate.substring(0, 7);

      // Asegurar que la fecha actual esté inicializada
      if (!appState.attendanceByDate[currentDate]) {
        appState.attendanceByDate[currentDate] = {};
      }
      const dayRecord = appState.attendanceByDate[currentDate];

      container.innerHTML = `
        <div class="space-y-6 max-w-7xl mx-auto">
          
          <!-- Barra de Control Superior: Sub-Tabs y Selectores de Fecha/Mes -->
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-xs flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Selector de Sub-Tabs -->
            <div class="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200">
              <button onclick="window.switchAttendanceSubTab('calendar-all')" class="px-3 py-1.5 rounded-md text-xs font-semibold transition-all flex items-center gap-1.5 ${attendanceSubTab === 'calendar-all' ? 'bg-white shadow-xs text-sky-800' : 'text-slate-600 hover:text-slate-900'}">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/></svg>
                Calendario Mensual (Todos)
              </button>
              <button onclick="window.switchAttendanceSubTab('calendar-patient')" class="px-3 py-1.5 rounded-md text-xs font-semibold transition-all flex items-center gap-1.5 ${attendanceSubTab === 'calendar-patient' ? 'bg-white shadow-xs text-sky-800' : 'text-slate-600 hover:text-slate-900'}">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.75 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
                Calendario por Paciente
              </button>
              <button onclick="window.switchAttendanceSubTab('daily')" class="px-3 py-1.5 rounded-md text-xs font-semibold transition-all flex items-center gap-1.5 ${attendanceSubTab === 'daily' ? 'bg-white shadow-xs text-sky-800' : 'text-slate-600 hover:text-slate-900'}">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Planilla Diaria (1-Clic)
              </button>
            </div>

            <!-- Navegación temporal según el sub-tab -->
            ${attendanceSubTab === 'daily' ? `
              <div class="flex items-center gap-3">
                <span class="text-xs font-semibold text-slate-700">Día en Roster:</span>
                <div class="flex items-center gap-1">
                  <button onclick="window.navigateAttendanceDate(-1)" class="p-2 border border-slate-300 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors" title="Día Anterior">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                  </button>
                  <input type="date" value="${currentDate}" onchange="window.handleAttendanceDateChange(this.value)" class="px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold text-slate-900 focus:outline-none focus:bg-white focus:border-sky-600">
                  <button onclick="window.navigateAttendanceDate(1)" class="p-2 border border-slate-300 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors" title="Día Siguiente">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                  </button>
                  <button onclick="window.handleAttendanceDateChange('${window.getTodayDateString()}')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium border border-slate-300 ml-1">
                    Hoy
                  </button>
                </div>
              </div>
            ` : `
              <div class="flex items-center gap-3">
                <span class="text-xs font-semibold text-slate-700">Mes Calendario:</span>
                <div class="flex items-center gap-1.5">
                  <button onclick="window.navigateAttendanceMonth(-1)" class="p-1.5 border border-slate-300 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors" title="Mes Anterior">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                  </button>
                  <input type="month" value="${currentMonth}" onchange="window.handleAttendanceMonthChange(this.value)" class="px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold text-slate-900 focus:outline-none focus:bg-white focus:border-sky-600">
                  <button onclick="window.navigateAttendanceMonth(1)" class="p-1.5 border border-slate-300 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors" title="Mes Siguiente">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                  </button>
                </div>
              </div>
            `}

          </div>

          <!-- Contenedor del Módulo de Asistencia Dinámico -->
          <div id="attendance-sub-content">
            <!-- Renderizado abajo -->
          </div>

        </div>
      `;

      renderAttendanceContent(currentDate, currentMonth, dayRecord);
    }

    function renderAttendanceContent(currentDate, currentMonth, dayRecord) {
      const container = document.getElementById('attendance-sub-content');
      if (!container) return;

      const activePatients = appState.patients.filter(p => p.status === 'Activo');

      // 1. VISTA: CALENDARIO MENSUAL POR PACIENTE (VISTA INDIVIDUAL COMPLETA)
      if (attendanceSubTab === 'calendar-patient') {
        const selectedId = window.selectedAttendancePatientId || (activePatients[0] ? activePatients[0].id : null);
        const patient = appState.patients.find(p => p.id === selectedId) || activePatients[0];

        if (!patient) {
          container.innerHTML = '<div class="bg-white p-12 text-center text-slate-400 rounded-xl text-xs">No hay pacientes activos para mostrar el calendario.</div>';
          return;
        }

        // Calcular días del mes seleccionado
        const [yearStr, monthStr] = currentMonth.split('-');
        const year = parseInt(yearStr, 10);
        const monthIndex = parseInt(monthStr, 10) - 1; // 0-based
        const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
        const firstDayDow = (new Date(year, monthIndex, 1).getDay() + 6) % 7; // Lunes = 0, Domingo = 6

        // Contar asistencias e inasistencias en el mes para este paciente
        let attendedCount = 0;
        let absentCount = 0;
        let licenseCount = 0;
        let totalOperativeDays = 0;

        for (let d = 1; d <= daysInMonth; d++) {
          const dt = new Date(year, monthIndex, d);
          const dow = dt.getDay();
          if (dow !== 0 && dow !== 6) { // Lunes a Viernes
            totalOperativeDays++;
            const dStr = `${yearStr}-${monthStr}-${String(d).padStart(2, '0')}`;
            const rec = appState.attendanceByDate[dStr] ? appState.attendanceByDate[dStr][patient.id] : null;
            if (rec) {
              if (rec.status === 'Presente') attendedCount++;
              else if (rec.status === 'Licencia') licenseCount++;
              else if (rec.status && rec.status.includes('Ausente')) absentCount++;
            }
          }
        }

        const adherenceRate = totalOperativeDays > 0 ? Math.round((attendedCount / totalOperativeDays) * 100) : 100;

        container.innerHTML = `
          <div class="space-y-6">
            
            <!-- Selector de Paciente & Resumen del Mes -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-xs flex flex-col md:flex-row items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-sky-800 text-white flex items-center justify-center font-bold text-base shadow-xs shrink-0">
                  ${patient.name.split(' ').map(n=>n[0]).slice(0,2).join('')}
                </div>
                <div>

                            <option value="Completa" ${rec.mealIntake === 'Completa' ? 'selected' : ''}>Completa</option>
                            <option value="Media" ${rec.mealIntake === 'Media' ? 'selected' : ''}>Media</option>
                            <option value="Baja" ${rec.mealIntake === 'Baja' ? 'selected' : ''}>Baja</option>
                            <option value="N/A" ${rec.mealIntake === 'N/A' ? 'selected' : ''}>No corresponde</option>
                          </select>
                        </td>
                        <td class="p-3.5">
                          <input type="text" value="${rec.notes || ''}" onchange="window.updateAttendanceField('${currentDate}', '${p.id}', 'notes', this.value)" placeholder="Observación..." class="w-full px-2 py-1 bg-slate-50 border border-slate-300 rounded text-xs">
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
    }

    window.switchAttendanceSubTab = function(sub) {
      attendanceSubTab = sub;
      renderAttendance(document.getElementById('app-main-content'));
    };

    window.selectAttendancePatient = function(id) {
      window.selectedAttendancePatientId = id;
      renderAttendance(document.getElementById('app-main-content'));
    };

    window.handleAttendanceDateChange = function(newDate) {
      if (!newDate) return;
      appState.selectedDate = newDate;
      window.commitState();
    };

    window.navigateAttendanceDate = function(offsetDays) {
      const current = new Date(appState.selectedDate || window.getTodayDateString());
      current.setDate(current.getDate() + offsetDays);
      const y = current.getFullYear();
      const m = String(current.getMonth() + 1).padStart(2, '0');
      const d = String(current.getDate()).padStart(2, '0');
      appState.selectedDate = `${y}-${m}-${d}`;
      window.commitState();
    };

    window.handleAttendanceMonthChange = function(newMonth) {
      if (!newMonth) return;
      appState.selectedMonth = newMonth;
      window.commitState();
    };

    window.navigateAttendanceMonth = function(offsetMonths) {
      const current = appState.selectedMonth || window.getTodayDateString().substring(0, 7);
      const [y, m] = current.split('-').map(Number);
      const dt = new Date(y, m - 1 + offsetMonths, 1);
      const newY = dt.getFullYear();
      const newM = String(dt.getMonth() + 1).padStart(2, '0');
      appState.selectedMonth = `${newY}-${newM}`;
      window.commitState();
    };

    // Alternar con 1 solo clic en el calendario: Sin Registro/Ausente -> Presente (✓) -> Ausente (✕)
    window.cyclePatientDayAttendance = function(dateStr, patientId) {
      if (!appState.attendanceByDate[dateStr]) {
        appState.attendanceByDate[dateStr] = {};
      }
      const currentRec = appState.attendanceByDate[dateStr][patientId];
      const current = currentRec ? currentRec.status : 'Sin registro';

      let nextStatus = 'Presente';
      if (current === 'Presente') {
        nextStatus = 'Ausente con aviso';
      } else {
        // Si estaba sin registro, ausente o con licencia, pasa de inmediato a PRESENTE (tick)
        nextStatus = 'Presente';
      }

      appState.attendanceByDate[dateStr][patientId] = {
        status: nextStatus,
        checkIn: nextStatus === 'Presente' ? '08:45' : '',
        checkOut: nextStatus === 'Presente' ? '17:15' : '',
        mealIntake: nextStatus === 'Presente' ? 'Completa' : 'N/A',
        notes: nextStatus === 'Ausente con aviso' ? 'Inasistencia notificada' : ''
      };

      const patient = appState.patients.find(p => p.id === patientId);
      const name = patient ? patient.name : 'Paciente';
      window.commitState(`${name}: Asistencia ${dateStr} marcada como ${nextStatus === 'Presente' ? '✓ Presente' : '✕ Ausente'}`);
    };

    window.updateAttendanceField = function(dateStr, patientId, field, value) {
      if (!appState.attendanceByDate[dateStr]) {
        appState.attendanceByDate[dateStr] = {};
      }
      if (!appState.attendanceByDate[dateStr][patientId]) {
        appState.attendanceByDate[dateStr][patientId] = {
          status: 'Presente',
          checkIn: '08:45',
          checkOut: '',
          mealIntake: 'Completa',
          notes: ''
        };
      }
      appState.attendanceByDate[dateStr][patientId][field] = value;
      window.commitState();
    };

    window.openDayDetailModal = function(dateStr, patientId) {
      const patient = appState.patients.find(p => p.id === patientId);
      if (!patient) return;
      const rec = (appState.attendanceByDate[dateStr] && appState.attendanceByDate[dateStr][patientId]) || { status: 'Presente', checkIn: '08:45', checkOut: '17:15', mealIntake: 'Completa', notes: '' };

      const modal = document.getElementById('modal-container');
      modal.className = 'fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50';
      modal.innerHTML = `
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col">
          <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
            <h3 class="font-bold text-sm">Detalle de Asistencia: ${dateStr}</h3>
            <button onclick="window.closeModal()" class="text-slate-400 hover:text-white">&times;</button>
          </div>
          <form onsubmit="window.saveDayDetailForm(event, '${dateStr}', '${patient.id}')" class="p-5 space-y-3.5 text-xs">
            <div>
              <span class="text-slate-500 font-semibold block text-[10px] uppercase">Paciente</span>
              <span class="font-bold text-slate-900 text-sm">${patient.name}</span>
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Estado de Asistencia</label>
              <select name="status" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold">
                <option value="Presente" ${rec.status === 'Presente' ? 'selected' : ''}>✓ Presente</option>
                <option value="Ausente con aviso" ${rec.status === 'Ausente con aviso' ? 'selected' : ''}>✕ Ausente con aviso</option>
                <option value="Injustificado" ${rec.status === 'Injustificado' ? 'selected' : ''}>✕ Injustificado</option>
                <option value="Licencia" ${rec.status === 'Licencia' ? 'selected' : ''}>Licencia Médica</option>
                <option value="Sin registro" ${rec.status === 'Sin registro' ? 'selected' : ''}>Sin registro</option>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Hora Llegada</label>
                <input type="time" name="checkIn" value="${rec.checkIn || '08:45'}" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-mono">
              </div>
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Hora Salida</label>
                <input type="time" name="checkOut" value="${rec.checkOut || '17:15'}" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-mono">
              </div>
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Observación del Día</label>
              <input type="text" name="notes" value="${rec.notes || ''}" placeholder="Ej: Acompañado por su hija, muy participativo" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs">
            </div>
            <div class="pt-3 border-t border-slate-200 flex items-center justify-end gap-2">
              <button type="button" onclick="window.closeModal()" class="px-3.5 py-1.5 border border-slate-300 hover:bg-slate-100 rounded-lg font-semibold text-slate-700 text-xs">Cancelar</button>
              <button type="submit" class="px-4 py-1.5 bg-sky-700 hover:bg-sky-800 text-white rounded-lg font-semibold text-xs shadow-xs">Guardar Cambios</button>
            </div>
          </form>
        </div>
      `;
    };

    window.saveDayDetailForm = function(event, dateStr, patientId) {
      event.preventDefault();
      const form = event.target;
      const status = form.status.value;
      if (status === 'Sin registro') {
        if (appState.attendanceByDate[dateStr]) {
          delete appState.attendanceByDate[dateStr][patientId];
        }
      } else {
        if (!appState.attendanceByDate[dateStr]) appState.attendanceByDate[dateStr] = {};
        appState.attendanceByDate[dateStr][patientId] = {
          status: status,
          checkIn: form.checkIn.value,
          checkOut: form.checkOut.value,
          mealIntake: status === 'Presente' ? 'Completa' : 'N/A',
          notes: form.notes.value.trim()
        };
      }
      window.closeModal();
      window.commitState(`Detalle de asistencia del ${dateStr} guardado`);
    };

    window.setQuickCheckOut = function(dateStr, patientId) {
      const now = new Date();
      const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      window.updateAttendanceField(dateStr, patientId, 'checkOut', timeStr);
    };

    window.markAllPresent = function(dateStr) {
      if (!appState.attendanceByDate[dateStr]) {
        appState.attendanceByDate[dateStr] = {};
      }
      appState.patients.filter(p => p.status === 'Activo').forEach(p => {
        appState.attendanceByDate[dateStr][p.id] = {
          status: 'Presente',
          checkIn: '08:45',
          checkOut: '17:30',
          mealIntake: 'Completa',
          notes: ''
        };
      });
      window.commitState(`Todos los pacientes activos marcados presentes el ${dateStr}`);
    };
  </script>

  <!-- MÓDULO 4: PLANIFICADOR DE TALLERES & MOTOR CLÍNICO -->

                        Ficha

                        <svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"/></svg>
                        Editar

                      <button onclick="window.promptDeleteWorkshop('${ws.id}')" class="px-2.5 py-1.5 bg-rose-50 border border-rose-200 hover:bg-rose-100 text-rose-700 rounded-lg text-xs font-semibold flex items-center gap-1 transition-colors" title="Eliminar Taller">
                        <svg class="w-3.5 h-3.5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>

    // Modal para Crear o Editar Taller

      modal.className = 'fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50';

      modal.innerHTML = `
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col">
          <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
            <h3 class="font-bold text-sm flex items-center gap-2">
              <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>

                <label class="block font-semibold text-slate-700 mb-1">Área Terapéutica</label>
                <select name="area" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs">
                  <option value="Cognitivo" ${existing && existing.area === 'Cognitivo' ? 'selected' : ''}>Cognitivo</option>
                  <option value="Físico/Kinesiológico" ${existing && existing.area === 'Físico/Kinesiológico' ? 'selected' : ''}>Físico / Kinesiológico</option>
                  <option value="Socio-emocional" ${existing && existing.area === 'Socio-emocional' ? 'selected' : ''}>Socio-emocional</option>
                  <option value="Ocupacional" ${existing && existing.area === 'Ocupacional' ? 'selected' : ''}>Ocupacional / Vida Diaria</option>
                </select>
              </div>

              <div>
                <label class="block font-semibold text-slate-700 mb-1">Cupo de Pacientes</label>
                <input type="number" name="participantsCount" min="1" max="25" value="${existing ? existing.participantsCount : 5}" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Días y Horarios</label>

              </div>

              <div>
                <label class="block font-semibold text-slate-700 mb-1">Profesional a Cargo</label>

            </div>

                  <svg class="w-3.5 h-3.5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>

    window.saveWorkshopForm = function(event, existingId) {
      event.preventDefault();
      const form = event.target;
      const name = form.name.value.trim();
      const area = form.area.value;
      const days = form.days.value.trim();
      const professional = form.professional.value.trim();
      const participantsCount = Number(form.participantsCount.value) || 5;

      if (!name) return;

      if (existingId) {
        const idx = appState.workshops.findIndex(w => w.id === existingId);
        if (idx !== -1) {
          appState.workshops[idx] = {
            ...appState.workshops[idx],
            name,
            area,
            days,
            professional,
            participantsCount
          };
          window.commitState(`Taller ${name} actualizado`);
        }
      } else {
        appState.workshops.push({
          id: 'ws-' + Date.now(),
          name,
          area,
          days,
          professional,
          targetLevels: ['Autovalente', 'DCL'],
          participantsCount
        });
        window.commitState(`Nuevo taller ${name} creado`);
      }
      window.closeModal();
    };

    // Modal de confirmación para eliminar taller
    window.promptDeleteWorkshop = function(wsId) {
      const ws = appState.workshops.find(w => w.id === wsId);
      if (!ws) return;

      const modal = document.getElementById('modal-container');
      modal.className = 'fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50';

      modal.innerHTML = `
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col">

            <div class="w-9 h-9 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
            </div>
            <div>
              <h3 class="font-bold text-sm text-rose-950">Confirmar Eliminación de Taller</h3>
              <p class="text-xs text-rose-700">Se eliminará del cronograma terapéutico</p>
            </div>
          </div>

          <div class="p-5 text-xs text-slate-700 space-y-2">
            <p>¿Estás seguro de que deseas eliminar el taller <strong>"${ws.name}"</strong>?</p>
            <p class="text-slate-500">Área: ${ws.area} • Horario: ${ws.days} • Responsable: ${ws.professional}</p>
          </div>

          <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-2.5">
            <button type="button" onclick="window.closeModal()" class="px-3.5 py-1.5 border border-slate-300 hover:bg-slate-100 rounded-lg font-semibold text-slate-700 text-xs transition-colors">
              Cancelar
            </button>
            <button type="button" onclick="window.deleteWorkshop('${ws.id}')" class="px-4 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-semibold text-xs transition-colors shadow-xs">
              Sí, Eliminar Taller
            </button>
          </div>
        </div>
      `;
    };

    window.deleteWorkshop = function(wsId) {
      const ws = appState.workshops.find(w => w.id === wsId);
      const name = ws ? ws.name : '';
      appState.workshops = appState.workshops.filter(w => w.id !== wsId);
      window.closeModal();
      window.commitState(`Taller "${name}" eliminado del cronograma`);
